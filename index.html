<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CalculatorJS</title>
	<link rel="stylesheet" href="./style/style.css">
	<script src="./scripts/calculator.js" defer></script>
</head>

<body>
	<div id="container">
		<div id="data"></div>
		<div id="display">
		</div>
		<div id="keyboard">
			<div class="button special-digits">⌫</div>
			<div class="button special-digits">AC</div>
			<div class="button special-digits">%</div>
			<div class="button operators" id="division">÷</div>
			<div class="button digits">7</div>
			<div class="button digits">8</div>
			<div class="button digits">9</div>
			<div class="button operators" id="multiplication">x</div>
			<div class="button digits">4</div>
			<div class="button digits">5</div>
			<div class="button digits">6</div>
			<div class="button operators" id="subtraction">–</div>
			<div class="button digits">1</div>
			<div class="button digits">2</div>
			<div class="button digits">3</div>
			<div class="button operators" id="addition">+</div>
			<div class="button digits">+/-</div>
			<div class="button digits">0</div>
			<div class="button digits">.</div>
			<div class="button operators" id="equal">=</div>
		</div>
	</div>
</body>

</html>
