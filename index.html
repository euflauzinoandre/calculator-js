<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CalculatorJS</title>
	<link rel="stylesheet" href="./style/style.css">
	<script src="scripts/calculator.js" defer></script>
</head>

<body>
	<div id="container">
		<div id="data"></div>
		<div id="display">
		</div>
		<div id="keyboard">
			<div class="button special-digits pointer" id="backspace">⌫</div>
			<div class="button special-digits pointer" id="allClear">AC</div>
			<div class="button special-digits pointer">%</div>
			<div class="button operators pointer" id="division">÷</div>
			<div class="button digits pointer">7</div>
			<div class="button digits pointer">8</div>
			<div class="button digits pointer">9</div>
			<div class="button operators pointer" id="multiplication">x</div>
			<div class="button digits pointer">4</div>
			<div class="button digits pointer">5</div>
			<div class="button digits pointer">6</div>
			<div class="button operators pointer" id="subtraction">–</div>
			<div class="button digits pointer">1</div>
			<div class="button digits pointer">2</div>
			<div class="button digits pointer">3</div>
			<div class="button operators pointer" id="addition">+</div>
			<div class="button digits pointer">+/-</div>
			<div class="button digits pointer">0</div>
			<div class="button digits pointer" id="dot">.</div>
			<div class="button operators pointer" id="equal">=</div>
		</div>
	</div>
	<footer>Powered by @Codezino</footer>
</body>

</html>
