<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CalculatorJS</title>
	<link rel="stylesheet" href="./style/style.css">
	<script src="scripts/calculator.js" defer></script>
</head>

<body>
	<div id="container">
		<div id="data">
			<div id="time"></div>
		</div>
		<div id="display">
		</div>
		<div id="keyboard">
			<button class="special-digits pointer" id="backspace">⌫</button>
			<button class="special-digits pointer" id="allClear">AC</button>
			<button class="special-digits pointer">%</button>
			<button class=" operators pointer" id="division">÷</button>
			<button class=" digits pointer">7</button>
			<button class=" digits pointer">8</button>
			<button class=" digits pointer">9</button>
			<button class=" operators pointer" id="multiplication">x</button>
			<button class=" digits pointer">4</button>
			<button class=" digits pointer">5</button>
			<button class=" digits pointer">6</button>
			<button class=" operators pointer" id="subtraction">–</button>
			<button class=" digits pointer">1</button>
			<button class=" digits pointer">2</button>
			<button class=" digits pointer">3</button>
			<button class=" operators pointer" id="addition">+</button>
			<button class=" digits pointer">+/-</button>
			<button class=" digits pointer">0</button>
			<button class=" digits pointer" id="dot">.</button>
			<button class=" operators pointer" id="equal">=</button>
		</div>
	</div>
	<footer>Powered by @Codezino</footer>
</body>

</html>
